name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          shellcheck -x entrypoint.sh lib/*.sh e2e/run.sh e2e/patroni-mock.sh
          shellcheck build-image.sh

      - name: bash -n
        run: |
          bash -n entrypoint.sh build-image.sh e2e/run.sh e2e/patroni-mock.sh
          for f in lib/*.sh; do bash -n "$f"; done

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: bats
        run: bats tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Reproducible image build
        run: |
          bash ./build-image.sh
          git diff --exit-code -- pinned-packages.txt

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e harness
        run: ./e2e/run.sh
